        <a class="back-link route-link" href="learning-map.html" aria-label="返回聲探查案路線" title="返回聲探查案路線">
          <img src="assets/navigation-paper/route.png" alt="">

        <div class="lesson-heading">
          <p class="eyebrow" data-group-label>第 1 組・輕量版</p>
          <h1>拆音「聲」探</h1>
          <p data-group-sounds>s · a · t · i · p · n</p>

      </header>

      <nav class="level-track circle-level-track" aria-label="拆音學習關卡" data-level-track></nav>

      <section class="lesson-panel segment-lesson-panel analysis-board-panel" aria-live="polite">
        <div class="lesson-progress">
          <span data-level-label>拆音練習</span>
          <div class="progress-bar" aria-hidden="true"><span data-progress-bar></span></div>
          <span data-progress-text>第 1 / 8 題</span>
        </div>

        <div class="segment-question-view" data-question-view>
          <div class="pseudoword-question-tools">
            <div class="pseudoword-info" hidden>
              <button type="button" data-code-info aria-expanded="false" aria-label="甚麼是「聲」探暗號？">
                <img src="assets/pseudoword-envelope.webp" alt="">
              </button>
              <p role="tooltip"><span>這是「聲」探暗號，</span><br><span>並非真正的英文字詞。</span></p>
            </div>
            <button class="skip-question-button" type="button" data-skip-question>跳過</button>
          </div>
          <div class="lesson-prompt segment-prompt">
            <h2 data-question-title>破解暗號</h2>
          </div>

          <button class="play-word-button question-play-button" type="button" data-play-word aria-label="播放詞語" title="播放詞語">
            <img src="assets/icons/play.svg" alt="" aria-hidden="true">
          </button>

          <div class="sound-slots segment-sound-slots" data-sound-slots aria-label="已選擇的聲音"></div>

          <div class="segment-arrange-tools">
            <button type="button" data-undo-selection disabled aria-label="復原" title="復原：移除上一個聲音">
              <img src="assets/icons/undo-2.svg" alt="" aria-hidden="true">
            </button>
            <button type="button" data-reset-selection disabled aria-label="重新排列" title="重新排列所有聲音">
              <img src="assets/icons/rotate-ccw.svg" alt="" aria-hidden="true">
            </button>
          </div>

          <div class="segment-sound-options" data-sound-options aria-label="可選擇的聲音"></div>
          <p class="answer-feedback" data-feedback role="status"></p>
        </div>

        <div class="complete-view" data-complete-view hidden>
          <div class="complete-mark" aria-hidden="true"><img src="assets/game-style/lesson-complete-segment.png" alt=""></div>
          <h2 data-complete-title>完成本組練習！</h2>
          <a class="back-link route-link completion-route-link" href="learning-map.html" aria-label="返回聲探查案路線" title="返回聲探查案路線"><img src="assets/navigation-paper/route.png" alt=""></a>

        <p class="pseudoword-answer-note" data-correct-pseudoword-note hidden>這是「聲」探暗號，並非真正的英文字詞。</p>

        <span class="correct-segments" data-correct-segments></span>
